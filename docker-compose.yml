version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetracking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timetracking
      POSTGRES_PASSWORD: timetracking
      POSTGRES_DB: timetracking
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracking -d timetracking"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timetracking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@timetracking.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timetracking-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USER: timetracking
      DB_PASSWORD: timetracking
      DATABASE_URL: jdbc:postgresql://postgres:5432/timetracking
      DATABASE_USERNAME: timetracking
      DATABASE_PASSWORD: timetracking
      JWT_SECRET: ${JWT_SECRET:-docker-change-me-in-production-docker-change-me}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timetracking-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  pgadmin-data:

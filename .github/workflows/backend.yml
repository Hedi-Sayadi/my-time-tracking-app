name: Backend CI

on:
  push:
    branches: [main, ci/dockerize-pipeline]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw compile --no-transfer-progress -B

      # Dockerize the test database: start PostgreSQL via the Docker CLI.
      # The docker-java library bundled with Testcontainers hardcodes API
      # version 1.32, which the self-hosted runner's Docker daemon rejects
      # (it requires 1.40+). Using the Docker CLI avoids this because the
      # CLI negotiates the API version automatically. We then point the
      # tests at this external PostgreSQL instead of spinning one up through
      # Testcontainers.
      - name: Start PostgreSQL container
        working-directory: .
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=timetracking \
            -e POSTGRES_USER=timetracking \
            -e POSTGRES_PASSWORD=timetracking \
            -p 5432:5432 \
            postgres:16

      - name: Wait for PostgreSQL
        working-directory: .
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U timetracking -d timetracking > /dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker logs ci-postgres
          exit 1

      - name: Run all tests
        env:
          TESTCONTAINERS_ENABLED: "false"
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/timetracking
          SPRING_DATASOURCE_USERNAME: timetracking
          SPRING_DATASOURCE_PASSWORD: timetracking
        run: ./mvnw test --no-transfer-progress -B

      - name: Stop PostgreSQL container
        if: always()
        working-directory: .
        run: |
          docker stop ci-postgres || true
          docker rm ci-postgres || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
spring:
  application:
    name: backend

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/timetracking
    username: ${DB_USER:timetracking}
    password: ${DB_PASSWORD:timetracking}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16:///timetracking?TC_REUSABLE=true
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-test-secret
  expiration-ms: 3600000

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

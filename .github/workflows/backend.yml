name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw compile --no-transfer-progress -B

      # Run only unit tests that don't require Docker (Testcontainers).
      # Integration tests (AuthControllerIntegrationTest, ProjectControllerIntegrationTest,
      # TaskControllerIntegrationTest, BackendApplicationTests) are skipped on this runner
      # because Docker is not yet available on the self-hosted CI machine.
      # They run successfully locally with Docker Desktop.
      - name: Run unit tests
        run: ./mvnw test --no-transfer-progress -B -Dtest=com.hedi.timetracking.backend.model.TaskTest,com.hedi.timetracking.backend.security.JwtUtilTest,com.hedi.timetracking.backend.service.TaskServiceTest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
